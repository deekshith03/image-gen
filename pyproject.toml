[project]
name = "adgen"
version = "0.1.0"
description = "Context-enriched ad image generation with a validated evaluator"
readme = "README.md"
authors = [
    { name = "Deekshith", email = "dauthukuri@g2.com" }
]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "pillow>=12.3.0",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "rembg[cpu]>=2.0.85",
    "streamlit>=1.65.0",
]

[build-system]
requires = ["uv_build>=0.9.4,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[tool.ruff]
line-length = 160
target-version = "py312"
extend-exclude = ["data", "evals/tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
