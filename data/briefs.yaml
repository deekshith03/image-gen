# Ad briefs: one row = one generation request.
# split is assigned by product (all briefs for a product share a split) to avoid dev→test leakage.
# tags record which hard case each brief covers:
#   hemi:south      southern hemisphere, so the season is inverted vs. the northern default
#   culture:risk    location prone to stereotyped imagery
#   cue:subtle      season not signalled by snow/beach (monsoon, dry season, mild winter…)
#   text:*          long | number | currency | punctuation | accent | non-latin | dup-on-product
#   fit:conflict    product and context pull in opposite directions

